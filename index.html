<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Life Notes</title>
<style>
  :root { --bg:#faf8f4; --fg:#1f1d1a; --muted:#77716a; --line:#e6e1d8; --link:#2b5c8a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --fg:#ece8e1; --muted:#9a948b; --line:#2c2a26; --link:#8fb8e0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; line-height:1.5; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:2rem; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  li { display:flex; justify-content:space-between; align-items:baseline; gap:16px;
       padding:14px 2px; border-bottom:1px solid var(--line); }
  li a { color:var(--link); text-decoration:none; font-size:1.05rem; }
  li a:hover { text-decoration:underline; }
  time { color:var(--muted); font-size:0.9rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
  [hidden] { display:none !important; }
  .empty { color:var(--muted); padding:14px 2px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Life Notes</h1>
  <p class="sub">Ghi chép cuộc sống</p>
  <ul id="notes">
    <li><a href="Change%20Yourself%20First.html">Chỉnh mình – cách giao tiếp mạnh mẽ nhất</a><time datetime="2026-10-25">25/10/2026</time></li>
    <li><a href="From%20Skills%20To%20Trust.html">Giỏi chưa đủ, phải đáng tin</a><time datetime="2026-10-19">19/10/2026</time></li>
    <li><a href="Three%20Things%20In%20Life.html">Ba việc của đời người</a><time datetime="2026-10-11">11/10/2026</time></li>
    <!-- Mỗi bài một dòng, bài mới nhất ở trên cùng:
         <li><a href="Morning%20Routine.html">Thói quen buổi sáng</a><time datetime="2026-10-11">11/10/2026</time></li> -->
  </ul>
  <p class="empty" id="empty">Chưa có bài nào.</p>
</main>
<script>
  // Hiện/ẩn dòng "Chưa có bài nào"
  function syncEmpty() {
    document.getElementById('empty').hidden = !!document.querySelector('#notes li');
  }
  syncEmpty();
  // GitHub Pages cho trình duyệt giữ bản cũ ~10 phút.
  // Tải ngầm bản mới nhất của chính trang này rồi cập nhật danh sách bài.
  (async () => {
    try {
      const res = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const fresh = new DOMParser().parseFromString(await res.text(), 'text/html').getElementById('notes');
      const cur = document.getElementById('notes');
      if (fresh && fresh.innerHTML !== cur.innerHTML) cur.innerHTML = fresh.innerHTML;
    } catch (e) {} finally { syncEmpty(); }
  })();
</script>
</body>
</html>
